name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.compiler.name }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {name: gcc, cc: gcc, cxx: g++}
          - {name: clang, cc: clang, cxx: clang++}
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSHEWCHUK_REQUIRE_GMP=ON
          -DSHEWCHUK_DEEP_TESTS=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Stage tables, hashes, constants and negative controls
        if: always()
        run: ctest --test-dir build -R "^(stages.coverage|differential.reference|negative_control.fp_contract|negative_control.default_flags|differential.library|library.lto_fast_math_caller|negative_control.lto_fast_math_caller|library.stages|library.no_fma|negative_control.no_fma|library.constants)$" --verbose
      # No performance gating: this only shows that the harness runs here and
      # which counter backend it found (hosted runners usually have none).
      - name: Benchmark smoke run
        if: always()
        run: ctest --test-dir build -R "^bench[.]" --verbose

  # Other x86 targets, Release only.
  #   x86-64-v3: FMA is available to the whole build, so the disassembly gate
  #     (library.no_fma) and the value hashes show that nothing was contracted.
  #   i386 sse2: 32-bit x86 with SSE2 arithmetic. No GMP (the distribution's
  #     is 64-bit): oracle.gmp_crosscheck reports itself as skipped.
  # x87 arithmetic is not supported: library.refuses_x87 (in every GCC leg)
  # checks that the library does not compile for it.
  linux-targets:
    name: linux ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: gcc x86-64-v3, cc: gcc, cxx: g++, flags: "-march=x86-64-v3", packages: libgmp-dev, gmp: "ON"}
          - {name: clang x86-64-v3, cc: clang, cxx: clang++, flags: "-march=x86-64-v3", packages: libgmp-dev, gmp: "ON"}
          - {name: gcc i386 sse2, cc: gcc, cxx: g++, flags: "-m32 -msse2 -mfpmath=sse", packages: gcc-multilib g++-multilib, gmp: "OFF"}
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.target.packages }}
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.target.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.target.cxx }}
          "-DCMAKE_C_FLAGS=${{ matrix.target.flags }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.target.flags }}"
          -DCMAKE_BUILD_TYPE=Release
          -DSHEWCHUK_REQUIRE_GMP=${{ matrix.target.gmp }}
          -DCMAKE_DISABLE_FIND_PACKAGE_GMP=${{ matrix.target.gmp == 'ON' && 'OFF' || 'ON' }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Stage tables, hashes, constants and negative controls
        if: always()
        run: ctest --test-dir build -R "^(stages.coverage|differential.reference|negative_control.fp_contract|differential.library|library.stages|library.no_fma|negative_control.no_fma|library.constants|library.refuses_x87)$" --verbose

  # The library and the tests under sanitizers. The pristine reference is not
  # instrumented (cmake/Sanitizers.cmake): it has a known one-past-the-end
  # read, which the library must not have.
  sanitizers:
    name: linux clang ${{ matrix.sanitizer.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - {name: asan+ubsan, flags: "address,undefined"}
          - {name: tsan, flags: thread}
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSHEWCHUK_REQUIRE_GMP=ON
          -DSHEWCHUK_SANITIZE=${{ matrix.sanitizer.flags }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  macos:
    name: macos apple-clang Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: brew list gmp >/dev/null 2>&1 || brew install gmp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHEWCHUK_REQUIRE_GMP=ON
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 3
      - name: Stage tables, hashes, constants and negative controls
        if: always()
        run: ctest --test-dir build -R "^(stages.coverage|differential.reference|negative_control.fp_contract|negative_control.default_flags|differential.library|library.lto_fast_math_caller|negative_control.lto_fast_math_caller|library.stages|library.no_fma|negative_control.no_fma|library.constants)$" --verbose
      # No performance gating: this only shows that the harness runs here and
      # which counter backend it found (hosted runners usually have none).
      - name: Benchmark smoke run
        if: always()
        run: ctest --test-dir build -R "^bench[.]" --verbose

  # /fp:precise is what the project sets on its own targets. With /fp:strict
  # in the user's flags the project uses /fp:strict instead
  # (cmake/StrictFloatingPoint.cmake).
  windows:
    name: windows msvc ${{ matrix.fp }} Release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        fp: ["/fp:precise", "/fp:strict"]
    env:
      CFLAGS: ${{ matrix.fp }}
      CXXFLAGS: ${{ matrix.fp }}
    steps:
      - uses: actions/checkout@v4
      # No GMP here: oracle.gmp_crosscheck reports itself as skipped. MSVC has
      # no -ffp-contract=fast, so negative_control.fp_contract is skipped too.
      - name: Configure
        run: cmake -S . -B build
      - name: Floating-point model of the library
        shell: bash
        run: grep -o "fp:[a-z]*\|<FloatingPointModel>[A-Za-z]*" build/src/shewchuk_predicates.vcxproj | sort | uniq -c
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -j 4
      - name: Stage tables, hashes, constants and negative controls
        if: always()
        run: ctest --test-dir build -C Release -R "^(stages.coverage|differential.reference|negative_control.fp_contract|negative_control.default_flags|differential.library|library.lto_fast_math_caller|negative_control.lto_fast_math_caller|library.stages|library.no_fma|negative_control.no_fma|library.constants)$" --verbose
      # No performance gating: this only shows that the harness runs here and
      # which counter backend it found (hosted runners usually have none).
      - name: Benchmark smoke run
        if: always()
        run: ctest --test-dir build -C Release -R "^bench[.]" --verbose
